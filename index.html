<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodrigo de França | Portfólio</title>
<meta name="description" content="Portfólio profissional de Rodrigo de França.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f; --surface:#12121a; --line:#23232f; --text:#e8e8ee; --muted:#9a9aab;
  --accent:#4fd1c5; --max:1080px;
  --head:"Outfit",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--text);font:400 1.0625rem/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 1.5rem}
section{padding:6rem 0}
h1,h2,h3{font-family:var(--head);line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:500;margin-bottom:2.5rem}

/* navbar */
nav{position:fixed;inset:0 0 auto 0;z-index:10;transition:background .3s,border-color .3s,backdrop-filter .3s;border-bottom:1px solid transparent}
nav.scrolled{background:rgba(10,10,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font:700 1.15rem var(--head)}
.links{display:flex;gap:1.75rem;font-size:.95rem;color:var(--muted)}
.links a{transition:color .2s}.links a:hover{color:var(--text)}
@media(max-width:640px){.links{gap:1rem;font-size:.88rem}.links .opt{display:none}}

/* hero */
.hero{min-height:100svh;display:flex;align-items:center;padding:8rem 0 5rem;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-12%;top:12%;width:520px;height:520px;border-radius:50%;
  border:1px solid var(--line);box-shadow:0 0 0 70px rgba(79,209,197,.025),0 0 0 140px rgba(79,209,197,.015);pointer-events:none}
.hero h1{font-size:clamp(2.8rem,9vw,6rem);font-weight:700;max-width:12ch}
.role{font:300 clamp(1.2rem,3vw,1.7rem) var(--head);color:var(--accent);margin:1.25rem 0 1.5rem}
.lead{max-width:56ch;color:var(--muted);font-size:1.15rem}
.cta{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2.5rem}
.btn{padding:.8rem 1.5rem;border-radius:999px;border:1px solid var(--line);font:500 .98rem var(--head);transition:transform .2s,border-color .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#04201d;border-color:var(--accent)}
.btn.primary:hover{background:#7fe3d9}
.in{opacity:0;transform:translateY(14px);animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
.in:nth-child(2){animation-delay:.12s}.in:nth-child(3){animation-delay:.24s}.in:nth-child(4){animation-delay:.36s}
@keyframes in{to{opacity:1;transform:none}}

/* sobre */
.about{display:grid;gap:3rem;grid-template-columns:1fr}
@media(min-width:860px){.about{grid-template-columns:1.2fr 1fr}}
.about p{color:var(--muted);margin-bottom:1rem;max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:.55rem;align-content:flex-start}
.tag{padding:.35rem .85rem;border:1px solid var(--line);border-radius:6px;font-size:.92rem;background:var(--surface);transition:border-color .2s,color .2s}
.tag:hover{border-color:var(--accent);color:var(--accent)}

/* projetos */
.grid{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{--c:var(--accent);position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:1.75rem;overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 14px 40px -18px var(--c)}
.mark{font:700 3.2rem/1 var(--head);color:var(--c);opacity:.9;margin-bottom:1.1rem;letter-spacing:-.04em}
.card h3{font-size:1.35rem;font-weight:500;margin-bottom:.6rem}
.card p{color:var(--muted);font-size:1rem;flex:1}
.stack{display:flex;flex-wrap:wrap;gap:.4rem;margin:1.25rem 0}
.stack span{font-size:.82rem;padding:.15rem .6rem;border-radius:4px;background:rgba(255,255,255,.05);color:var(--text)}
.stack span:first-child{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.repo{font:500 .95rem var(--head);color:var(--c);display:inline-flex;gap:.4rem;align-items:center}
.repo svg{width:16px;height:16px;transition:transform .2s}.card:hover .repo svg{transform:translateX(4px)}

/* experiência */
.tl{border-left:1px solid var(--line);margin-left:.5rem}
.job{position:relative;padding:0 0 2.5rem 2rem}
.job::before{content:"";position:absolute;left:-5px;top:.55rem;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.job h3{font-size:1.25rem;font-weight:500}
.job .meta{color:var(--accent);font-size:.95rem;margin:.2rem 0 .5rem}
.job p{color:var(--muted);max-width:62ch}

/* contato */
.contact{background:var(--surface);border-top:1px solid var(--line)}
.contact h2{max-width:16ch}
.contact p{color:var(--muted);max-width:52ch;margin-bottom:2rem}
footer{padding:1.5rem 0;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}

/* revelar ao rolar */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in,.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<nav id="nav">
  <div class="wrap">
    <a href="#topo" class="logo" id="logo"></a>
    <div class="links">
      <a href="#sobre">Sobre</a><a href="#projetos">Projetos</a>
      <a href="#experiencia" class="opt">Experiência</a><a href="#contato">Contato</a>
    </div>
  </div>
</nav>

<main>
  <header class="hero" id="topo">
    <div class="wrap">
      <h1 class="in" id="nome"></h1>
      <p class="role in" id="cargo"></p>
      <p class="lead in" id="resumo"></p>
      <div class="cta in">
        <a class="btn primary" href="#projetos">Ver projetos</a>
        <a class="btn" id="b-in" target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn" id="b-gh" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <section id="sobre"><div class="wrap rv">
    <h2>Sobre mim</h2>
    <div class="about">
      <div id="sobre-txt"></div>
      <div class="tags" id="skills" aria-label="Competências técnicas"></div>
    </div>
  </div></section>

  <section id="projetos"><div class="wrap rv">
    <h2>Projetos</h2>
    <div class="grid" id="projetos-grid"></div>
  </div></section>

  <section id="experiencia"><div class="wrap rv">
    <h2>Experiência profissional</h2>
    <div class="tl" id="exp"></div>
  </div></section>

  <section class="contact" id="contato"><div class="wrap rv">
    <h2>Vamos conversar sobre dados.</h2>
    <p id="fecho"></p>
    <div class="cta" id="contato-links"></div>
  </div></section>
</main>

<footer><div class="wrap" id="rodape"></div></footer>

<noscript><p style="padding:2rem;text-align:center">Ative o JavaScript para visualizar o conteúdo.</p></noscript>

<script>
/* =========================================================
   EDITE AQUI: todo o conteúdo do site está neste objeto.
   Os campos marcados com [PREENCHER] são provisórios.
   ========================================================= */
const DATA = {
  nome: "Rodrigo de França",
  cargo: "[PREENCHER: Engenheiro de Dados / Cientista de Dados / ...]",
  resumo: "[PREENCHER: 2 a 3 linhas sobre sua trajetória e o tipo de problema que você resolve.]",
  linkedin: "https://www.linkedin.com/in/rodrigodefrancac/",
  github: "https://github.com/SEU-USUARIO",
  instagram: "https://www.instagram.com/comunica.rodrigo/",
  email: "", // ex.: "voce@email.com"
  sobre: [
    "[PREENCHER: parágrafo sobre sua formação e trajetória.]",
    "[PREENCHER: parágrafo sobre como você trabalha e o que busca.]"
  ],
  skills: ["Python","SQL","[PREENCHER]","[PREENCHER]","[PREENCHER]"],
  projetos: [
    { nome:"[Projeto 1]", lang:"Python", stack:["Python","[Tecnologia]"], url:"https://github.com/SEU-USUARIO/PROJETO-1",
      desc:"[PREENCHER: o que o projeto faz e qual problema resolve.]" },
    { nome:"[Projeto 2]", lang:"SQL", stack:["SQL","[Tecnologia]"], url:"https://github.com/SEU-USUARIO/PROJETO-2",
      desc:"[PREENCHER: o que o projeto faz e qual problema resolve.]" },
    { nome:"[Projeto 3]", lang:"JavaScript", stack:["JavaScript","[Tecnologia]"], url:"https://github.com/SEU-USUARIO/PROJETO-3",
      desc:"[PREENCHER: o que o projeto faz e qual problema resolve.]" }
  ],
  experiencia: [
    { cargo:"[Cargo]", empresa:"[Empresa]", periodo:"[Início] a [Fim]", desc:"[PREENCHER: principais entregas e resultados.]" },
    { cargo:"[Cargo]", empresa:"[Empresa]", periodo:"[Início] a [Fim]", desc:"[PREENCHER: principais entregas e resultados.]" }
  ],
  fecho: "Estou aberto a novas oportunidades e conversas sobre projetos. Escreva uma mensagem e respondo assim que possível."
};

/* cor e marca visual por linguagem principal */
const LANGS = {
  Python:{c:"#5aa9e6",m:"Py"}, SQL:{c:"#f0a04b",m:"SQL"}, JavaScript:{c:"#f1e05a",m:"JS"},
  TypeScript:{c:"#4b8bdc",m:"TS"}, R:{c:"#4aa3df",m:"R"}, Go:{c:"#3fd0e0",m:"Go"},
  Java:{c:"#e0805a",m:"Jv"}, Scala:{c:"#e5575f",m:"Sc"}, Rust:{c:"#d9906a",m:"Rs"},
  "Jupyter Notebook":{c:"#f5844c",m:"Nb"}, HTML:{c:"#e86c3a",m:"<>"}, Shell:{c:"#8fd16a",m:"$_"}
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrow = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg>';

document.title = DATA.nome + " | Portfólio";
$("logo").textContent = DATA.nome.split(" ")[0];
$("nome").textContent = DATA.nome;
$("cargo").textContent = DATA.cargo;
$("resumo").textContent = DATA.resumo;
$("b-in").href = DATA.linkedin;
$("b-gh").href = DATA.github;
$("sobre-txt").innerHTML = DATA.sobre.map(p => `<p>${esc(p)}</p>`).join("");
$("skills").innerHTML = DATA.skills.map(s => `<span class="tag">${esc(s)}</span>`).join("");

$("projetos-grid").innerHTML = DATA.projetos.map(p => {
  const l = LANGS[p.lang] || {c:"#4fd1c5", m:(p.lang||"•").slice(0,2)};
  return `<article class="card" style="--c:${l.c}">
    <div class="mark" aria-hidden="true">${esc(l.m)}</div>
    <h3>${esc(p.nome)}</h3>
    <p>${esc(p.desc)}</p>
    <div class="stack">${p.stack.map(s => `<span>${esc(s)}</span>`).join("")}</div>
    <a class="repo" href="${esc(p.url)}" target="_blank" rel="noopener">Ver repositório ${arrow}</a>
  </article>`;
}).join("");

$("exp").innerHTML = DATA.experiencia.map(e => `<article class="job">
  <h3>${esc(e.cargo)}</h3><div class="meta">${esc(e.empresa)}, ${esc(e.periodo)}</div><p>${esc(e.desc)}</p></article>`).join("");

$("fecho").textContent = DATA.fecho;
const links = [["LinkedIn", DATA.linkedin], ["GitHub", DATA.github], ["Instagram", DATA.instagram]];
if (DATA.email) links.unshift(["E-mail", "mailto:" + DATA.email]);
$("contato-links").innerHTML = links.map(([t,u],i) =>
  `<a class="btn${i===0?" primary":""}" href="${esc(u)}" ${u.startsWith("mailto")?"":'target="_blank" rel="noopener"'}>${t}</a>`).join("");
$("rodape").textContent = "© " + new Date().getFullYear() + " " + DATA.nome;

/* navbar com blur ao rolar */
const nav = $("nav");
const onScroll = () => nav.classList.toggle("scrolled", scrollY > 20);
addEventListener("scroll", onScroll, {passive:true}); onScroll();

/* revelar seções ao rolar */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("on"); io.unobserve(e.target); }
}), {threshold:.12});
document.querySelectorAll(".rv").forEach(el => io.observe(el));
</script>
</body>
</html>
